{% if page.mermaid %}
<!-- Mermaid: 마크다운의 ```mermaid 코드 블록을 실제 다이어그램으로 그려줍니다.
     이 사이트의 kramdown은 <pre><code class="language-mermaid">...</code></pre> 형태로 출력합니다.
     이 include는 반드시 extensions/code-highlight.html보다 먼저 로드되어야 합니다 -
     code-highlight.html이 DOMContentLoaded 시점에 페이지의 모든 pre code 블록을 순회하며
     hljs.highlightBlock()을 걸고, 그 과정에서 class를 "language-mermaid"에서
     "hljs mermaid"로 바꿔버려서 mermaid가 찾을 수 없게 만드는 문제가 있었습니다.
     그래서 code-highlight.html의 DOMContentLoaded 리스너가 등록되기 전에, 여기서 먼저
     mermaid 블록을 <div class="mermaid">로 바꿔치기해서 hljs의 querySelectorAll('pre code')
     대상에서 아예 빠지도록 합니다. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('code.language-mermaid').forEach(function (code) {
      var host = code.closest('div.language-mermaid') || code.closest('pre') || code;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      host.replaceWith(div);
    });
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'dark' });
      mermaid.run();
    }
  });
</script>
{% endif %}
