title: Kaki's Dev Log
description: 버그는 줄이고 배움은 늘려가는 중

# 테마 및 경로 설정
remote_theme: jeffreytse/jekyll-theme-yat@v1.10.0
url: "https://fg-kaki.github.io"
baseurl: "/my-blog"

# yat 테마 전용 헤더 문구 설정
# (title이 메인 큰 글씨로 들어가고, tagline이 설명글로 나옵니다)
tagline: 배운 것을 정리하고 기록하는 공간

# 포인트(브랜드) 컬러 - 다크 카키 톤
# 링크, 태그, 배지 등 강조 요소에 쓰입니다
brand_color: "#8C8863"

# 코드 블록 상단 언어 배지 컬러 (브랜드 컬러와 통일)
code_badge:
  color: "#1b1b14"
  background_color: "#8C8863"

# yat 테마 배너 설정 (공식 키는 banner_img가 아니라 banner 입니다.
# 기존 banner_img 키는 테마가 인식하지 못해 배너가 아예 안 뜨고 있었어요 - 여기서 바로잡았습니다)
banner:
  image: /assets/images/banner.jpg
  # 배너 이미지 위에 깔리는 오버레이 톤: 기존의 평평한 검정 대신
  # 카키가 은은하게 도는 그라데이션으로 부드럽게
  background: "linear-gradient(180deg, rgba(14,14,14,0.25) 0%, rgba(20,19,13,0.9) 100%)"

# 다크모드로만 쓸 예정이라 방문할 때마다 기본값을 다크로 열리게 설정
# (우측 상단 토글로 그때그때 라이트로 바꿔볼 수는 있고, 새 탭/새 방문에서는 다시 다크로 리셋됩니다)
night_mode: "on"

# 상단 헤더 메뉴에 노출할 페이지 (지정 안 하면 루트의 모든 페이지가
# 자동으로 다 뜨는데, 그러면 아래 markdown-test.md도 같이 떠버려서 명시적으로 지정)
header_pages:
  - archives.html
  - about.md

# 사이트 빌드에서 제외할 파일 - 테마 문법 테스트용으로 쓰신 파일이라
# 실제 페이지로는 생성되지 않도록 뺐습니다. 파일 자체는 저장소에 남아있어요.
exclude:
  - markdown-test.md
  - CLAUDE.md

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Google Analytics 4 측정 ID
# 방문자가 브라우저에서 Do Not Track을 켜놨으면 테마가 자동으로 스크립트를 안 돌립니다 (enableDNT 기본값 true)
google_analytics: G-NZQFPJGCNP

# 댓글 시스템: utterances (GitHub Issue 기반, 무료/광고없음)
# repo에 Utterances 앱(https://github.com/apps/utterances)을 설치하고
# 이 repo에 접근 권한을 줘야 실제로 동작합니다. 저장소는 public이어야 합니다.
utterances:
  repo: "FG-Kaki/my-blog"
  issue_term: "pathname" # 글 경로 기준으로 이슈 매칭 (제목 바뀌어도 안 끊김)
  label: "comment" # 자동 생성되는 이슈에 붙는 라벨
  theme: "github-dark" # follow_site_theme가 꺼졌을 때 쓰일 기본 테마
  follow_site_theme: true # 사이트 다크/라이트 토글에 댓글창도 같이 따라가게