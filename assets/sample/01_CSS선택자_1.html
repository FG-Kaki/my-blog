<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
        style 태그 내부는 HTML 영역이 아닌
        CSS 언어의 영역이다
        */
        /* 전체 선택자 테스트 */
        *{
            color: red;
        }
    /* 태그 선택자 테스트 */
    li{
        color: pink;
    }
    /* 아이디 선택자 테스트 id=# */
    #id3{
        color: magenta;
        background-color: yellow;
    }
    /* 클래스 선택자 테스트 class=. */
    .class3{
        color: blue;
        background-color: yellow;
    }
    </style>
</head>
<body>
    <h1>CSS 기본 선택자</h1>
    <pre>
        선택자(selector)란?
        특정한 HTML 요소를 선택할 때 사용하는 기능이다. 
        요소를 선택하여 원하는 스타일과 기능을 적용 할 수 있다. 
    </pre>
    <h3>모든 선택자</h3>
    <p>HTML 문서 안의 모든 요소를 선택할 때 전체 선택자를 사용 가능하다! </p>
    <ul>
        <li>테스트1</li>
        <li>테스트2</li>
        <li>테스트3</li>
    </ul>
    <hr>
    <h3>아이디 선택자</h3>
    <ol>
        <li id="id1"></li>
        <li id="id2"></li>
        <li id="id3"></li>
        <li id="id4"></li>
        <li id="id5"></li>
    </ol>
    <hr>
    <h3>클래스 선택자</h3>
    <ul>
        <li class="class1">클래스 테스트1</li>
        <li class="class2">클래스 테스트2</li>
        <li class="class3" id="id3">클래스 테스트3</li>
        <li class="class4">클래스 테스트4</li>
        <li class="class5">클래스 테스트5</li>
    </ul>
</body>
</html>
